<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多个界面画板校对</title><link rel="stylesheet" href="../../assets/prototype-runtime.css"><link rel="stylesheet" href="artboard-surfaces.css"></head><body data-page-id="detail" data-prototype-mode="static"><main>
<section data-ps-state="default"><h2>预约详情</h2><div class="sr-snapshot"><div class="fixture-page"><h3>预约详情</h3><p id="default-summary" data-rule-ref="INT-SUMMARY">讨论室 A · 10:00—11:00</p><p>当前员工 · 已预约</p><button id="default-cancel" type="button" data-rule-ref="INT-CANCEL">取消预约</button></div></div></section>
<section data-ps-state="confirm" data-ps-base-state="default"><h2>取消确认</h2><div class="sr-snapshot" data-ps-artboards>
<section class="sr-artboard" data-ps-surface="page"><h3 class="sr-artboard-title">预约详情</h3><div class="sr-artboard-body fixture-page"><p id="confirm-summary" data-ps-origin="#default-summary" data-rule-ref="INT-BACKGROUND-SUMMARY">讨论室 A · 10:00—11:00</p><p>当前员工 · 已预约</p><button id="confirm-cancel" type="button" data-ps-origin="#default-cancel" data-rule-ref="INT-BACKGROUND-CANCEL">取消预约</button></div></section>
<section class="sr-artboard" data-ps-surface="dialog" data-ps-trigger="#confirm-cancel"><h3 class="sr-artboard-title">取消确认弹窗</h3><p class="sr-artboard-caption">由预约详情的“取消预约”按钮触发；实际产品以弹窗打开。</p><div class="sr-artboard-body"><div class="sr-dialog-preview"><h4 id="confirm-title">确认取消预约？</h4><p id="confirm-context" data-rule-ref="INT-CONTEXT">讨论室 A · 10:00—11:00</p><div class="fixture-actions"><button id="confirm-keep" type="button" data-rule-ref="INT-KEEP">保留预约</button><button id="confirm-send" type="button" data-rule-ref="INT-SEND">确认取消</button></div></div></div></section>
</div></section></main><script src="artboard-surfaces-data.js"></script><script src="../../assets/prototype-runtime.js"></script></body></html>
